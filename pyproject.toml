[build-system]
requires = ["setuptools==82.0.1", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wti-quant-research"
version = "0.1.0"
description = "Reproducible one-month-ahead WTI research and forecast evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.4",
  "pandas==3.0.2",
  "scipy==1.17.1",
  "openpyxl==3.1.5",
  "arch==8.0.0",
  "matplotlib==3.10.9",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.12", "build==1.3.0"]

[project.scripts]
quant-research = "quant_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_research = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
