name: WTI research package

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'README.md'
      - 'Dockerfile'
      - '.dockerignore'
      - 'master_datasheet.xlsx'
      - '.github/workflows/research-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'README.md'
      - 'Dockerfile'
      - '.dockerignore'
      - 'master_datasheet.xlsx'
      - '.github/workflows/research-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/research-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest
      - run: python -m build --no-isolation
      - name: Smoke-test the built wheel outside the repository
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          quant-research --output "$GITHUB_WORKSPACE/results/ci-demo"
      - uses: actions/upload-artifact@v4
        with:
          name: research-demo-python-${{ matrix.python }}
          path: |
            results/ci-demo
            dist

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wti-research .
      - run: docker run --rm wti-research
