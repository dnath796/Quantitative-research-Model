[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-analytics-engine"
version = "1.0.0"
description = "Coursework-ready derivatives pricing, strategy, and risk analytics engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
derivatives-engine = "derivatives_engine.cli:main"

[tool.setuptools.packages.find]
include = ["derivatives_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

